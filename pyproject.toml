[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "launchpad-control"
version = "0.1.0"
description = "Desktop control surface for the Novation Launchpad Pro [MK3] on Linux"
requires-python = ">=3.11"  # tomllib
dependencies = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
launchpad-control = "launchpad_control.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
launchpad_control = ["default_config.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
